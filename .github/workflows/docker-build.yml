name: Build and Deploy to ECS

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Set image information
      - name: Set image variables
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "repository=$ECR_REGISTRY/driverdashboard" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # 5. Build Docker image
      - name: Build Docker image
        env:
          IMAGE: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
        run: |
          docker build --no-cache \
            -t "$IMAGE" .

      # 6. Test Docker image
      - name: Test Docker image
        env:
          IMAGE: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
        run: |
          docker run --rm \
            "$IMAGE" \
            python -c "import cv2; print('OpenCV:', cv2.__version__)"

      # 7. Push Docker image to ECR
      - name: Push Docker image to ECR
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
        run: |
          docker push "$IMAGE"

      # 8. Download current ECS task definition
      - name: Download ECS task definition
        if: github.event_name == 'push'
        run: |
          aws ecs describe-task-definition \
            --task-definition fleetflow-task \
            --region us-east-1 \
            --query taskDefinition \
            --output json > task-definition.json

      # 9. Remove ECS-generated fields
      - name: Clean task definition
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json

          with open("task-definition.json") as f:
              task = json.load(f)

          for key in [
              "taskDefinitionArn",
              "revision",
              "status",
              "requiresAttributes",
              "compatibilities"
          ]:
              task.pop(key, None)

          with open("task-definition.json", "w") as f:
              json.dump(task, f, indent=2)
          PY

      # 10. Replace the image in the task definition
      - name: Update ECS task definition image
        if: github.event_name == 'push'
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: fleetflow
          image: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}

      # 11. Deploy to ECS
      - name: Deploy to ECS
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: fleetflow-service
          cluster: fleetflow-cluster
          wait-for-service-stability: true